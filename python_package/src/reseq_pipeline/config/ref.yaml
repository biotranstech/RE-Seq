  gtf: /mnt/sda/project/yjc1/pipeline/01_RE-seq/Refer/rn6/rn6.refGene.gtf
  tf: /mnt/sda/project/yjc1/pipeline/01_RE-seq/Refer/mm10/Mus_musculus_TF.txt
  length: /mnt/sda/project/yjc1/pipeline/01_RE-seq/Refer/rn6/rn6_gene.length.txt
  name: RN6